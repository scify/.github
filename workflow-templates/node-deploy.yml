# Manual deployment of a static frontend build to the production server.
# The logic lives in scify/.github. Change inputs here, not the steps.
# Inputs: https://github.com/scify/.github/blob/main/.github/workflows/node-deploy.yml
#
# Create a GitHub environment named "production" with these secrets:
#   SSH_HOST, SSH_PORT, SSH_USER, SSH_PRIVATE_KEY, PROJECT_PATH, ENV_FILE (optional)
name: Deploy production

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    uses: scify/.github/.github/workflows/node-deploy.yml@v1
    with:
      environment: production
      # build-directory: dist
      # delete-remote-files: true
    secrets:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_PORT: ${{ secrets.SSH_PORT }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      PROJECT_PATH: ${{ secrets.PROJECT_PATH }}
      ENV_FILE: ${{ secrets.ENV_FILE }}
