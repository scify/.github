# Reusable CI workflow for npm-only repositories (Vue, React, TypeScript SPAs).
#
# To use it: start from workflow-templates/node-ci.yml and pin the short tag @v0.1
# (never an exact release such as @v0.1.4). Procedure for people and AI agents:
# https://github.com/scify/.github/blob/main/.github/workflows/README.md#adopt-in-an-existing-repository
#
# Minimal call (every value below is a default and can be left out):
#
#   jobs:
#     ci:
#       uses: scify/.github/.github/workflows/node-ci.yml@v0.1
#
# Full call, with example values:
#
#   jobs:
#     ci:
#       uses: scify/.github/.github/workflows/node-ci.yml@v0.1
#       secrets:
#         CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}   # only with coverage-file
#       with:
#         node-version-file: .nvmrc
#         node-version: ''
#         working-directory: frontend
#         lint-command: npm run lint -- --max-warnings=0
#         types-command: npx vue-tsc --noEmit
#         test-command: npx vitest run --coverage --coverage.reporter=lcov
#         coverage-file: coverage/lcov.info
#         build-command: npm run build
#         browser-tests: true
#         browser-test-command: npx playwright test
#         playwright-browsers: chromium firefox
#
# Jobs, all in parallel:
#   lint   Static checks. With an empty lint-command / types-command, the job runs
#          `check` or `lint`, then `types` or `type-check`, when package.json defines them.
#   test   test-command. When it is empty, `npm run test` if package.json defines it.
#          Uploads coverage to Codecov when coverage-file is set.
#   build  build-command.
#   e2e    build-command, then browser tests with Playwright. Runs only with browser-tests: true.
#   ci     One aggregate check for branch protection. It is green when no job
#          failed or was cancelled. A skipped e2e job counts as green.
#
# Require the check "ci / CI" in branch protection (caller job id / this job name).
# Every command runs inside working-directory.
#
# The setup steps are YAML anchors (&name) in the lint job, reused (*name) by
# the other jobs. Change a setup step once, in the lint job.
name: Node CI

on:
  workflow_call:
    inputs:
      node-version-file:
        description: 'File that pins the Node.js version, relative to the repository root. Example: .nvmrc, frontend/.nvmrc, package.json'
        type: string
        default: .nvmrc
      node-version:
        description: "Explicit Node.js version. When set, it takes precedence over node-version-file. Example: '22', '24.1.0', 'lts/*'"
        type: string
        default: ''
      working-directory:
        description: 'Folder that holds package.json, relative to the repository root. Example: ., frontend, apps/web'
        type: string
        default: .
      lint-command:
        description: 'Command for code style and lint. Empty means npm `check` or `lint` script. Example: npm run lint -- --max-warnings=0'
        type: string
        default: ''
      types-command:
        description: 'Command for type checking. Empty means npm `types` or `type-check` script. Example: npx tsc --noEmit, npx vue-tsc --noEmit'
        type: string
        default: ''
      test-command:
        description: 'Command that runs the unit tests. Empty means npm `test` script. Example: npx vitest run, npm test -- --coverage'
        type: string
        default: ''
      coverage-file:
        description: 'Coverage report that test-command writes, relative to working-directory. Setting it turns on the Codecov upload. Example: coverage/lcov.info, coverage/clover.xml'
        type: string
        default: ''
      build-command:
        description: 'Command that builds the project. Example: npm run build, npm run build -- --mode staging'
        type: string
        default: npm run build
      browser-tests:
        description: 'Run the e2e job with Playwright. One of: true, false'
        type: boolean
        default: false
      browser-test-command:
        description: 'Command that runs the browser tests. Example: npx playwright test, npm run test:e2e'
        type: string
        default: npx playwright test
      playwright-browsers:
        description: 'Space-separated Playwright browsers to install. Example: chromium, chromium firefox webkit'
        type: string
        default: chromium
    secrets:
      CODECOV_TOKEN:
        description: Codecov upload token. Needed only when coverage-file is set.
        required: false

permissions:
  contents: read

jobs:
  lint:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      # ---- Shared setup: the other jobs reuse these steps through *anchors ----
      - &checkout
        name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - &setup-node
        name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}
          node-version-file: ${{ inputs.node-version == '' && inputs.node-version-file || '' }}
          cache: npm
          cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json

      - &npm-ci
        name: Install npm dependencies
        run: npm ci
      # ---- End of shared setup ----

      - name: Code style and lint
        env:
          LINT_COMMAND: ${{ inputs.lint-command }}
        run: |
          if [ -n "$LINT_COMMAND" ]; then bash -c "$LINT_COMMAND"; exit; fi
          has_script() {
            node -e "process.exit(require('./package.json').scripts?.['$1'] ? 0 : 1)"
          }
          if has_script check; then npm run check
          elif has_script lint; then npm run lint
          else echo "No check or lint script, skipping"; fi

      - name: Type check
        env:
          TYPES_COMMAND: ${{ inputs.types-command }}
        run: |
          if [ -n "$TYPES_COMMAND" ]; then bash -c "$TYPES_COMMAND"; exit; fi
          has_script() {
            node -e "process.exit(require('./package.json').scripts?.['$1'] ? 0 : 1)"
          }
          if has_script types; then npm run types
          elif has_script type-check; then npm run type-check
          else echo "No types or type-check script, skipping"; fi

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - *checkout
      - *setup-node
      - *npm-ci

      - name: Tests
        env:
          TEST_COMMAND: ${{ inputs.test-command }}
        run: |
          if [ -n "$TEST_COMMAND" ]; then bash -c "$TEST_COMMAND"; exit; fi
          if node -e "process.exit(require('./package.json').scripts?.test ? 0 : 1)"; then npm run test
          else echo "No test script, skipping"; fi

      # Pull requests from forks get no secrets, so a failed upload fails the job
      # only for pushes and same-repository pull requests.
      - name: Upload coverage to Codecov
        if: inputs.coverage-file != ''
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ${{ inputs.working-directory }}/${{ inputs.coverage-file }}
          slug: ${{ github.repository }}
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - *checkout
      - *setup-node
      - *npm-ci

      - name: Build
        env:
          BUILD_COMMAND: ${{ inputs.build-command }}
        run: bash -c "$BUILD_COMMAND"

  e2e:
    name: Browser tests
    if: inputs.browser-tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - *checkout
      - *setup-node
      - *npm-ci

      # Keyed on package-lock.json, which pins the Playwright version. On a cache hit
      # `playwright install` skips the download and only installs the OS dependencies.
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ inputs.playwright-browsers }}-${{ hashFiles(format('{0}/package-lock.json', inputs.working-directory)) }}

      - name: Install Playwright browsers
        env:
          PLAYWRIGHT_BROWSERS: ${{ inputs.playwright-browsers }}
        run: |
          # Word splitting is intended: one argument per browser.
          # shellcheck disable=SC2086
          npx playwright install --with-deps $PLAYWRIGHT_BROWSERS

      - name: Build
        env:
          BUILD_COMMAND: ${{ inputs.build-command }}
        run: bash -c "$BUILD_COMMAND"

      - name: Browser tests
        env:
          BROWSER_TEST_COMMAND: ${{ inputs.browser-test-command }}
        run: bash -c "$BROWSER_TEST_COMMAND"

  ci:
    name: CI
    needs: [lint, test, build, e2e]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check job results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "lint:  ${{ needs.lint.result }}"
          echo "test:  ${{ needs.test.result }}"
          echo "build: ${{ needs.build.result }}"
          echo "e2e:   ${{ needs.e2e.result }}"
          case " $RESULTS " in
            *" failure "*|*" cancelled "*)
              echo "::error::At least one job failed or was cancelled."
              exit 1
              ;;
          esac
