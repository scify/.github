# Reusable security workflow for SciFY repositories.
#
# To use it: start from workflow-templates/security.yml and pin the short tag @v0.1
# (never an exact release such as @v0.1.4). Procedure for people and AI agents:
# https://github.com/scify/.github/blob/main/.github/workflows/README.md#adopt-in-an-existing-repository
#
# Call it from a repository workflow:
#
#   on:
#     pull_request:
#     schedule:
#       - cron: '0 11 * * 1'
#   jobs:
#     security:
#       uses: scify/.github/.github/workflows/security.yml@v0.1
#
# Jobs, all independent:
#   secrets        committed .env files; Gitleaks over the pull request commits,
#                  or the full history on push and schedule
#   dev-configs    scripts and suspicious commands in .vscode/.claude/.cursor/.idea
#                  (scan-dev-configs action; allow reviewed scripts with allowed-dev-scripts)
#   npm-hardening  .npmrc and lockfile checks (verify-npm-hardening action)
#   audit          `composer audit` and `npm audit` against the lock files; npm audit
#                  runs on the Node.js version from .nvmrc when the repository has one
#
# Each check runs only when the repository has the matching files, so the
# same call works for Laravel, npm-only and PHP-only repositories.
name: Security

on:
  workflow_call:
    inputs:
      working-directory:
        description: 'Folder that holds composer.json and package.json, relative to the repository root. The npm hardening and audit checks run there. Example: ., frontend, apps/web'
        type: string
        default: .
      php-version:
        description: PHP version used to run `composer audit`.
        type: string
        default: '8.4'
      composer-abandoned:
        description: 'What composer audit does with abandoned packages. One of: ignore, report, fail'
        type: string
        default: report
      npm-audit-level:
        description: Lowest npm advisory severity that fails the audit (low, moderate, high, critical).
        type: string
        default: high
      npm-audit-omit-dev:
        description: 'Audit only the production dependencies (npm audit --omit=dev). Use it when a dev tool has an advisory without a fix. Example: true, false'
        type: boolean
        default: false
      node-version-file:
        description: 'File that pins the Node.js version for npm audit, relative to the repository root. Empty: the .nvmrc in working-directory when it exists, else the Node.js of the runner. Example: .nvmrc, frontend/.nvmrc, package.json'
        type: string
        default: ''
      strict-dev-configs:
        description: Fail on suspicious commands in dev tool configs. Default only warns.
        type: boolean
        default: false
      gitleaks-full-history:
        description: 'Scan the full git history on pull requests too. By default a pull request scans only its own commits; push and schedule runs always scan the full history. One of: true, false'
        type: boolean
        default: false
      npm-min-release-age:
        description: "Lowest accepted min-release-age in .npmrc, in days. 7 or more. Example: '14'"
        type: string
        default: '7'
      allowed-dev-scripts:
        description: "Newline-separated glob patterns of reviewed script files allowed in dev tool directories. `*` also matches `/`. Example: .claude/hooks/*.sh"
        type: string
        default: ''

permissions:
  contents: read

jobs:
  secrets:
    name: Secrets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # The whole repository, not only working-directory. Examples, test files
      # and templates (.dist, .sample, .template, .tpl, Jinja) are allowed.
      - name: Check for committed environment files
        run: |
          found=$(find . -type f -name '.env*' \
            -not -path '*/vendor/*' -not -path '*/node_modules/*' -not -path './.git/*' \
            -not -name '.env.testing' -not -name '.env.ci' \
            -not -name '.env*.example' -not -name '.env*.dist' -not -name '.env*.sample' \
            -not -name '.env*.template' -not -name '.env*.tpl' \
            -not -name '.env*.j2' -not -name '.env*.jinja' -not -name '.env*.jinja2')
          if [ -n "$found" ]; then
            echo "::error::Environment files are committed to the repository:"
            echo "$found"
            exit 1
          fi
          echo "No environment files committed."

      - name: Install Gitleaks
        env:
          VERSION: 8.30.1
          SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          echo "${SHA256}  gitleaks.tar.gz" | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks
          rm gitleaks.tar.gz

      # Gitleaks also reads .gitleaksignore (fingerprints of accepted findings)
      # from the repository root by itself.
      - name: Run Gitleaks
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          FULL_HISTORY: ${{ inputs.gitleaks-full-history }}
        run: |
          args=(git --redact --no-banner)
          if [ -f .gitleaks.toml ]; then
            args+=(--config .gitleaks.toml)
            echo "Using repository .gitleaks.toml"
          else
            echo "No .gitleaks.toml, using the built-in rules"
          fi
          if [ "$EVENT" = pull_request ] && [ "$FULL_HISTORY" != true ]; then
            echo "Scanning the pull request commits ${BASE_SHA:0:7}..${HEAD_SHA:0:7}"
            args+=("--log-opts=--no-merges ${BASE_SHA}..${HEAD_SHA}")
          else
            echo "Scanning the full git history"
          fi
          ./gitleaks "${args[@]}" .

  dev-configs:
    name: Dev tool configs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The org requires actions pinned by SHA, so this workflow cannot call its
      # own actions by tag. It checks out scify/.github at the exact commit of
      # this workflow file and runs the actions from a local path.
      - name: Check out the shared actions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .scify-github
          persist-credentials: false

      - name: Scan dev tool config directories
        uses: ./.scify-github/.github/actions/scan-dev-configs
        with:
          strict: ${{ inputs.strict-dev-configs }}
          allowed-scripts: ${{ inputs.allowed-dev-scripts }}

  npm-hardening:
    name: npm supply chain hardening
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The org requires actions pinned by SHA, so this workflow cannot call its
      # own actions by tag. It checks out scify/.github at the exact commit of
      # this workflow file and runs the actions from a local path.
      - name: Check out the shared actions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .scify-github
          persist-credentials: false

      - name: Verify npm hardening
        if: hashFiles(format('{0}/package.json', inputs.working-directory)) != ''
        uses: ./.scify-github/.github/actions/verify-npm-hardening
        with:
          working-directory: ${{ inputs.working-directory }}
          min-age: ${{ inputs.npm-min-release-age }}

      - name: No package.json
        if: hashFiles(format('{0}/package.json', inputs.working-directory)) == ''
        run: echo "No package.json, skipping."

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP
        if: hashFiles(format('{0}/composer.lock', inputs.working-directory)) != ''
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ inputs.php-version }}
          coverage: none
          tools: composer:v2

      # --locked reads composer.lock, so no `composer install` is needed.
      # Abandoned packages only get reported by default: a transitive package
      # without a replacement is not something a pull request can fix.
      - name: Composer audit
        if: hashFiles(format('{0}/composer.lock', inputs.working-directory)) != ''
        env:
          ABANDONED: ${{ inputs.composer-abandoned }}
        run: composer audit --locked --abandoned="$ABANDONED" --format=table

      # npm checks engines and devEngines in package.json, so npm audit needs the
      # repository's Node.js version, not the one on the runner.
      - name: Find the Node.js version file
        id: node
        if: hashFiles(format('{0}/package-lock.json', inputs.working-directory)) != ''
        env:
          NODE_VERSION_FILE: ${{ inputs.node-version-file }}
          WORKING_DIRECTORY: ${{ inputs.working-directory }}
        run: |
          if [ -n "$NODE_VERSION_FILE" ]; then
            echo "file=$NODE_VERSION_FILE" >> "$GITHUB_OUTPUT"
          elif [ -f .nvmrc ]; then
            echo "file=$WORKING_DIRECTORY/.nvmrc" >> "$GITHUB_OUTPUT"
          else
            echo "No .nvmrc, npm audit uses the Node.js of the runner."
          fi

      - name: Set up Node.js
        if: steps.node.outputs.file != ''
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ${{ steps.node.outputs.file }}
          # npm audit reads the lock file only; there is nothing to cache.
          package-manager-cache: false

      - name: npm audit
        if: hashFiles(format('{0}/package-lock.json', inputs.working-directory)) != ''
        env:
          LEVEL: ${{ inputs.npm-audit-level }}
          OMIT_DEV: ${{ inputs.npm-audit-omit-dev }}
        run: |
          args=(--audit-level="$LEVEL")
          if [ "$OMIT_DEV" = true ]; then
            args+=(--omit=dev)
          fi
          npm audit "${args[@]}"

      - name: Nothing to audit
        if: hashFiles(format('{0}/composer.lock', inputs.working-directory), format('{0}/package-lock.json', inputs.working-directory)) == ''
        run: echo "No composer.lock or package-lock.json, skipping."
