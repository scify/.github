# Reusable, opt-in OWASP Dependency-Check scan.
#
#   jobs:
#     owasp:
#       uses: scify/.github/.github/workflows/owasp-dependency-check.yml@v0.1
#       secrets:
#         NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
#
# Without an NVD API key the vulnerability database download is throttled and
# the scan can take a long time or fail. Request a free key at
# https://nvd.nist.gov/developers/request-an-api-key and store it as a secret.
#
# The scan produces an HTML report artifact. It fails the job only when
# `fail-on-cvss` is set.
name: OWASP Dependency-Check

on:
  workflow_call:
    inputs:
      project-name:
        description: Project name shown in the report. Defaults to the repository name.
        type: string
        default: ''
      fail-on-cvss:
        description: Fail when a finding has a CVSS score at or above this value (0 to 10). Empty means report only.
        type: string
        default: ''
      version:
        description: OWASP Dependency-Check version (Docker image tag).
        type: string
        default: '13.0.0'
    secrets:
      NVD_API_KEY:
        description: NVD API key. Optional but strongly recommended.
        required: false

permissions:
  contents: read

jobs:
  scan:
    name: OWASP Dependency-Check
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Restore vulnerability database cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/dependency-check-data
          key: owasp-dependency-check-${{ inputs.version }}-${{ github.run_id }}
          restore-keys: owasp-dependency-check-${{ inputs.version }}-

      - name: Run Dependency-Check
        env:
          PROJECT: ${{ inputs.project-name != '' && inputs.project-name || github.event.repository.name }}
          FAIL_ON_CVSS: ${{ inputs.fail-on-cvss }}
          VERSION: ${{ inputs.version }}
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
          DATA_DIR: ${{ runner.temp }}/dependency-check-data
        run: |
          mkdir -p "$DATA_DIR" report
          args=(--scan /src --project "$PROJECT" --format HTML --out /report --enableRetired --disableOssIndex)
          [ -n "$NVD_API_KEY" ] && args+=(--nvdApiKey "$NVD_API_KEY")
          [ -n "$FAIL_ON_CVSS" ] && args+=(--failOnCVSS "$FAIL_ON_CVSS")
          [ -z "$NVD_API_KEY" ] && echo "::warning::No NVD_API_KEY secret. The database download is throttled."
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "$PWD:/src:ro" \
            -v "$PWD/report:/report" \
            -v "$DATA_DIR:/usr/share/dependency-check/data" \
            "owasp/dependency-check:${VERSION}" "${args[@]}"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: owasp-dependency-check-report
          path: report/
          retention-days: 30
