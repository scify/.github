# Reusable deployment workflow for Laravel applications on a SciFY server.
#
# What it does:
#   1. Checks out the application, and optionally one extra repository.
#   2. Writes .env from the ENV_FILE secret (when the secret is set).
#   3. Builds frontend assets on the runner.
#   4. Verifies the deploy user belongs to the web server group.
#   5. Uploads the files with rsync over SSH.
#   6. On the server: maintenance mode, composer install, migrations,
#      storage link, caches, permissions script, PHP-FPM restart, back online.
#
# Call it from a repository workflow:
#
#   jobs:
#     deploy:
#       uses: scify/.github/.github/workflows/laravel-deploy.yml@v1
#       with:
#         environment: production
#       secrets:
#         SSH_HOST: ${{ secrets.SSH_HOST }}
#         SSH_PORT: ${{ secrets.SSH_PORT }}
#         SSH_USER: ${{ secrets.SSH_USER }}
#         SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
#         PROJECT_PATH: ${{ secrets.PROJECT_PATH }}
#         ENV_FILE: ${{ secrets.ENV_FILE }}
#
# Server requirements:
#   - The deploy user can run `sudo systemctl restart <php-fpm-service>` without a password,
#     otherwise the restart is skipped with a message.
#   - Optional: a `set-laravel-permissions-ci.sh` script in the repository root.
#     It runs after the deploy with the project path as its only argument.
name: Laravel deploy

on:
  workflow_call:
    inputs:
      environment:
        description: GitHub environment that holds the secrets, for example production or staging.
        type: string
        default: production
      php-binary:
        description: Path to the PHP CLI on the server.
        type: string
        default: /usr/bin/php8.4
      php-fpm-service:
        description: PHP-FPM service to restart after the deploy. Empty skips the restart.
        type: string
        default: php8.4-fpm
      composer-binary:
        description: Path to Composer on the server.
        type: string
        default: /usr/local/bin/composer
      web-server-group:
        description: Unix group of the web server. The deploy user must be a member. Empty skips the check.
        type: string
        default: www-data
      build-frontend:
        description: Build frontend assets on the runner before upload.
        type: boolean
        default: true
      build-command:
        description: Command that builds the frontend assets, for example `npm run build:ssr`.
        type: string
        default: npm run build
      node-version-file:
        description: File that pins the Node.js version.
        type: string
        default: .nvmrc
      run-migrations:
        description: Run `php artisan migrate --force` on the server.
        type: boolean
        default: true
      exclude:
        description: Comma-separated rsync exclude list. The default covers a standard Laravel repository.
        type: string
        default: /.git/,/.github/,/.ddev/,/ddev/,/docs/,/tasks/,/tests/,/tools/,/storage/,node_modules,*.md,*.example,.env.testing,.editorconfig,.gitleaks.toml,.npmrc,.nvmrc,.prettierignore,.stylelintrc.json,eslint.config.ts,eslint.config.js,package.json,package-lock.json,phpstan.neon,phpstan.neon.dist,phpunit.xml,pint.json,postcss.config.js,prettier.config.cjs,rector.php,sonar-project.properties,tsconfig.json,vite.config.ts,vite.config.js
      extra-exclude:
        description: Comma-separated project-specific paths appended to the exclude list.
        type: string
        default: ''
      extra-checkout-repository:
        description: Optional second repository to check out, as owner/name.
        type: string
        default: ''
      extra-checkout-ref:
        description: Branch or tag of the extra repository.
        type: string
        default: main
      extra-checkout-path:
        description: Folder inside the application where the extra repository is placed.
        type: string
        default: ''
    secrets:
      SSH_HOST:
        description: Server hostname or IP address.
        required: true
      SSH_PORT:
        description: SSH port. Defaults to 22.
        required: false
      SSH_USER:
        description: Deploy user on the server.
        required: true
      SSH_PRIVATE_KEY:
        description: Private key of the deploy user.
        required: true
      PROJECT_PATH:
        description: Absolute path of the application on the server.
        required: true
      ENV_FILE:
        description: Full content of the production .env file. When empty, the .env on the server is left untouched.
        required: false
      EXTRA_CHECKOUT_TOKEN:
        description: Token with read access to the extra repository, when it is private.
        required: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    timeout-minutes: 20
    concurrency:
      group: deploy-${{ inputs.environment }}
      cancel-in-progress: false
    steps:
      - name: Check out application
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out extra repository
        if: inputs.extra-checkout-repository != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.extra-checkout-repository }}
          ref: ${{ inputs.extra-checkout-ref }}
          path: ${{ inputs.extra-checkout-path }}
          token: ${{ secrets.EXTRA_CHECKOUT_TOKEN || github.token }}
          persist-credentials: false

      - name: Write .env from the ENV_FILE secret
        if: env.ENV_FILE != ''
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: printf '%s\n' "$ENV_FILE" > .env

      - name: Set up Node.js
        if: inputs.build-frontend
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ${{ inputs.node-version-file }}
          cache: npm

      - name: Build frontend assets
        if: inputs.build-frontend
        env:
          BUILD_COMMAND: ${{ inputs.build-command }}
        run: |
          npm ci
          bash -c "$BUILD_COMMAND"

      - name: Verify the deploy user belongs to the web server group
        if: inputs.web-server-group != ''
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          WEB_GROUP: ${{ inputs.web-server-group }}
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT || '22' }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: WEB_GROUP
          script: |
            set -e
            if ! id -nG "$(whoami)" | tr ' ' '\n' | grep -qx "$WEB_GROUP"; then
              echo "ERROR: user $(whoami) is not a member of group $WEB_GROUP."
              echo "Run on the server: sudo usermod -a -G $WEB_GROUP $(whoami)"
              exit 1
            fi
            echo "User $(whoami) is a member of group $WEB_GROUP"

      - name: Upload application files
        uses: easingthemes/ssh-deploy@2cc5b27bf3029d0455dd5e09fe02633904031447 # v6.0.3
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          REMOTE_HOST: ${{ secrets.SSH_HOST }}
          REMOTE_USER: ${{ secrets.SSH_USER }}
          REMOTE_PORT: ${{ secrets.SSH_PORT || '22' }}
          SOURCE: ./
          TARGET: ${{ secrets.PROJECT_PATH }}/
          EXCLUDE: ${{ inputs.exclude }}${{ inputs.extra-exclude != '' && format(',{0}', inputs.extra-exclude) || '' }}${{ inputs.extra-checkout-path != '' && format(',/{0}/.git/', inputs.extra-checkout-path) || '' }}
          SSH_CMD_ARGS: -o IdentitiesOnly=yes -o StrictHostKeyChecking=no

      - name: Deploy on the server
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          PROJECT_DIR: ${{ secrets.PROJECT_PATH }}
          PHP_CMD: ${{ inputs.php-binary }}
          COMPOSER_CMD: ${{ inputs.composer-binary }}
          RUN_MIGRATIONS: ${{ inputs.run-migrations }}
          PHP_FPM_SERVICE: ${{ inputs.php-fpm-service }}
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT || '22' }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: PROJECT_DIR,PHP_CMD,COMPOSER_CMD,RUN_MIGRATIONS,PHP_FPM_SERVICE
          script: |
            set -e
            cd "$PROJECT_DIR"

            mkdir -p storage/framework/sessions
            mkdir -p storage/framework/views
            mkdir -p storage/framework/cache
            mkdir -p storage/logs
            mkdir -p storage/app/public
            mkdir -p bootstrap/cache

            echo "Putting application in maintenance mode"
            "$PHP_CMD" artisan down || true

            echo "PHP version:"
            "$PHP_CMD" -v | head -n 1

            echo "Installing Composer dependencies"
            "$PHP_CMD" "$COMPOSER_CMD" install \
              --no-interaction \
              --prefer-dist \
              --optimize-autoloader \
              --no-dev

            if [ "$RUN_MIGRATIONS" = "true" ]; then
              echo "Running database migrations"
              "$PHP_CMD" artisan migrate --force
            fi

            echo "Creating storage symlink"
            "$PHP_CMD" artisan storage:link --force

            echo "Rebuilding caches"
            "$PHP_CMD" artisan optimize:clear
            "$PHP_CMD" artisan config:cache
            "$PHP_CMD" artisan route:cache
            "$PHP_CMD" artisan view:cache

            if [ -f set-laravel-permissions-ci.sh ]; then
              echo "Setting file permissions"
              chmod +x set-laravel-permissions-ci.sh
              ./set-laravel-permissions-ci.sh "$PROJECT_DIR"
            fi

            if [ -n "$PHP_FPM_SERVICE" ]; then
              echo "Restarting $PHP_FPM_SERVICE"
              sudo systemctl restart "$PHP_FPM_SERVICE" 2>/dev/null || \
              sudo service "$PHP_FPM_SERVICE" restart 2>/dev/null || \
              echo "PHP-FPM restart skipped"
            fi

            echo "Taking application out of maintenance mode"
            "$PHP_CMD" artisan up

            echo "Deployment complete"

      - name: Report deploy failure
        if: failure()
        env:
          PHP_CMD: ${{ inputs.php-binary }}
        run: |
          echo "::error::Deploy failed. The application may still be in maintenance mode."
          echo "::error::After you fix the problem, bring it back online:"
          echo "::error::ssh <SSH_USER>@<SSH_HOST> '$PHP_CMD <PROJECT_PATH>/artisan up'"
