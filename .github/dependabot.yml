# Dependabot for this repository. Unlike the templates in templates/, this
# enables version updates: the actions pinned here are inherited by every
# caller, so they must stay current.
version: 2

updates:
    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: weekly
          day: monday
          time: '06:00'
          timezone: Etc/UTC
      open-pull-requests-limit: 5
      labels:
          - dependencies
          - github-actions
      groups:
          github-actions:
              patterns:
                  - '*'
