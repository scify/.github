name: Bug report
description: Something does not work as expected.
labels:
  - bug
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the problem. Include error messages if you have them.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to …
        2. Click …
        3. See the error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: The release, tag, or commit hash you tested.
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Browser, operating system, PHP or Node version, and anything else that seems relevant.
