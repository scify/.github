# Continuous integration for an npm-only repository (Vue, React, TypeScript).
# The logic lives in scify/.github. Change inputs here, not the steps.
# Inputs: https://github.com/scify/.github/blob/main/.github/workflows/node-ci.yml
name: CI

on:
  push:
    branches: [$default-branch]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    uses: scify/.github/.github/workflows/node-ci.yml@v1
    # with:
    #   node-version: '24'          # when the repository has no .nvmrc
    #   working-directory: frontend # when package.json is not at the root
